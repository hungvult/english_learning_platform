name: CI

on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master", "dev", "develop"]

jobs:
  backend:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "server/requirements.txt"

      - name: Install system dependencies (ODBC)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run Ruff check
        run: ruff check server/ scripts/ seed_data/

      - name: Run Ruff format check
        run: ruff format --check server/ scripts/ seed_data/

      - name: Run pytest
        run: pytest server/tests/

  frontend:
    name: Frontend Prettier & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
